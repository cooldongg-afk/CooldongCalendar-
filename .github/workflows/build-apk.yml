name: Build Cooldong Calendar unsigned release (private signing needed)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms/android-35" || true
          sdkmanager --list_installed | head -65

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon --console=plain

      - name: Upload unsigned release for private signing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CooldongCalendar-v1.4.1-UNSIGNED-private-signing-required
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Prepare local signing utility
        run: |
          test -f "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ./apksigner.jar

      - name: Upload Android signing utility
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Android-apksigner-tool-internal
          path: apksigner.jar
          if-no-files-found: error

